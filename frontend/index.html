<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f1eb" />
    <title>MetroMitra — Delhi Metro Route Finder</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div class="app-shell">

      <main class="workspace">

        <div class="content-grid">
          <aside class="planner-card">
            <div class="journey-tabs" role="tablist" aria-label="Journey planner">
              <button id="single-trip-tab" class="journey-tab active" role="tab" aria-selected="true" type="button">Plan a journey</button>
              <button id="meetup-tab" class="journey-tab" role="tab" aria-selected="false" type="button">Meet friends</button>
            </div>
            <div class="card-heading" data-single-trip>
              <div><h2>Choose your stations</h2></div>
            </div>

            <div class="station-fields" data-single-trip>
              <label class="station-field" for="origin">
                <span class="field-icon origin-dot" aria-hidden="true"></span>
                <span class="field-content"><span class="field-label">FROM</span><input id="origin" list="station-options" placeholder="Search starting station" autocomplete="off" /></span>
              </label>
              <button id="swap-stations" class="swap-button" type="button" aria-label="Swap start and end stations" title="Swap stations">⇅</button>
              <label class="station-field destination-field" for="destination">
                <span class="field-icon destination-pin" aria-hidden="true"></span>
                <span class="field-content"><span class="field-label">TO</span><input id="destination" list="station-options" placeholder="Search destination station" autocomplete="off" /></span>
              </label>
              <datalist id="station-options"></datalist>
            </div>

            <div class="mode-heading" data-single-trip><span class="field-label">ROUTE PREFERENCE</span></div>
            <div class="mode-list" data-single-trip role="group" aria-label="Route optimization mode">
              <button class="mode-option active" data-mode="time" type="button">
                <span class="mode-symbol time-symbol">◷</span><span class="mode-text"><strong>Fastest time</strong></span><span class="mode-radio"></span>
              </button>
              <button class="mode-option" data-mode="distance" type="button">
                <span class="mode-symbol distance-symbol">↗</span><span class="mode-text"><strong>Shortest distance</strong></span><span class="mode-radio"></span>
              </button>
              <button class="mode-option" data-mode="transfers" type="button">
                <span class="mode-symbol transfer-symbol">⇄</span><span class="mode-text"><strong>Fewest transfers</strong></span><span class="mode-radio"></span>
              </button>
            </div>

            <button id="find-route" class="find-button" data-single-trip type="button"><span>Find my route</span><span aria-hidden="true">→</span></button>

            <section id="route-results" class="route-results hidden" data-single-trip aria-live="polite">
              <div class="results-title"><div><h2 id="route-heading">—</h2></div><span id="route-mode-tag" class="route-mode-tag">FASTEST</span></div>
              <div class="metric-grid">
                <div class="metric"><span class="metric-icon">◷</span><strong id="metric-time">—</strong><small>EST. MINUTES</small></div>
                <div class="metric"><span class="metric-icon">↗</span><strong id="metric-distance">—</strong><small>DISTANCE</small></div>
                <div class="metric"><span class="metric-icon">⇄</span><strong id="metric-transfers">—</strong><small>CHANGES</small></div>
              </div>
              <div id="line-summary" class="line-summary"></div>
            </section>

            <section id="meetup-panel" class="meetup-panel hidden" aria-label="Plan a meetup for friends">

              <h2>Where should everyone meet?</h2>

              <label class="friend-destination-field" for="meetup-destination"><span class="field-label">DESTINATION (OPTIONAL)</span><input id="meetup-destination" list="station-options" placeholder="Meet on the way to a final station" autocomplete="off" /></label>
              <div id="friend-stations" class="friend-stations">
                <label class="friend-station-row"><span class="friend-number">1</span><input data-friend-station list="station-options" placeholder="Friend 1 starting station" autocomplete="off" /></label>
                <label class="friend-station-row"><span class="friend-number">2</span><input data-friend-station list="station-options" placeholder="Friend 2 starting station" autocomplete="off" /></label>
              </div>
              <button id="add-friend" class="add-friend-button" type="button">＋ Add a friend</button>
              <button id="find-meetup" class="find-button" type="button"><span>Find meetup station</span><span aria-hidden="true">→</span></button>

              <section id="meetup-results" class="meetup-results hidden" aria-live="polite"></section>
            </section>
          </aside>

          <section class="map-card" aria-label="Delhi Metro network map">
            <div class="map-topline"><div><h2>Route map</h2></div><div class="map-tools"><button id="reset-map" type="button" title="Fit route in map">⤢</button></div></div>
            <section id="route-stations-panel" class="route-stations-panel" aria-label="Metro stations along the selected route">
              <div class="route-stations-heading"><strong>Stops</strong><span id="stop-count">Find a route to see stops</span></div>
              <ol id="route-stops" class="route-stops"></ol>
            </section>
            <div class="map-stage">
              <div id="map" role="img" aria-label="Map showing only the selected metro route"></div>
              <div id="map-empty" class="map-empty-state"><strong>Choose your stations to see the route.</strong></div>
            </div>
            <div class="map-footer"><div id="line-legend" class="line-legend"></div></div>
          </section>
        </div>
      </main>
    </div>
    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
